# sha2lato — the agent box.
#
#   agent         kimaki + opencode 2 + ui-ux-pro-max skill (the custom image)
#   dind          docker-in-docker sidecar: the agent builds & runs project
#                 images through it (DOCKER_HOST), isolated from the host
#   whisper       optional local speech-to-text for voice notes (profile, off)
#   github-runner optional self-hosted GitHub Actions runner (profile, off)
#
# Personal config lives in secrets/*.env (see the *.example files) and
# compose/.env. This file stays impersonal — fork-friendly by design.

name: sha2lato

services:
  agent:
    # Local build by default; point SHA2LATO_AGENT_IMAGE at your registry
    # image in compose/.env once CI publishes it (see docs/ci-cd.md).
    image: ${SHA2LATO_AGENT_IMAGE:-sha2lato-agent:local}
    build:
      context: ../agent
    restart: unless-stopped
    env_file:
      # Runtime config: KIMAKI_BOT_TOKEN, MACHINE_NAME, optional provider
      # keys. Create from secrets/.env.agent.example. Optional on purpose:
      # the stack must come up for local builds even before you configure it.
      - path: ../secrets/.env.agent
        required: false
    environment:
      # DinD sidecar over TLS (certs shared via the dind-certs volume)
      DOCKER_HOST: tcp://docker:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
    volumes:
      - agent-data:/data
      - dind-certs:/certs:ro
      # SSH keys for git (Forgejo/GitHub deploy keys) — see docs/secrets.md
      - ../secrets/ssh:/root/.ssh:ro
    healthcheck:
      test: ["CMD", "sh", "-c", "kimaki status --data-dir \"$${KIMAKI_DATA_DIR:-/data}\""]
      interval: 60s
      timeout: 15s
      start_period: 60s
      retries: 3

  dind:
    image: docker:29-dind
    restart: unless-stopped
    # Privileged by design (the agent builds and runs images): this is
    # host-kernel-equivalent power — keep the host single-tenant.
    # See docs/hosting.md → Security notes.
    privileged: true
    # TLS daemon on 2376 (entrypoint default host/tls); certs into /certs
    command: ["--host=tcp://0.0.0.0:2376", "--tlsverify"]
    # The agent reaches this daemon as `docker:2376` (DOCKER_HOST below);
    # the service is named `dind`, so register the matching network alias.
    networks:
      default:
        aliases:
          - docker
    environment:
      DOCKER_TLS_CERTDIR: /certs
      # Only so the in-container healthcheck CLI can reach the daemon
      DOCKER_HOST: tcp://localhost:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
    volumes:
      - dind-certs:/certs
      - dind-data:/var/lib/docker
    healthcheck:
      # docker version hits /version only. docker info queries containerd,
      # which in docker 29's dind (experimental embedded-containerd mode) can
      # transiently answer "only one connection allowed" (single-client
      # embedded server) — see docs/troubleshooting.md.
      test: ["CMD", "docker", "version", "--format", "{{.Server.Version}}"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  # Optional: local speech-to-text for Kimaki voice notes (profile "whisper").
  # Enable with COMPOSE_PROFILES=whisper in compose/.env, then point the agent
  # at it (KIMAKI_WHISPER_URL=http://whisper:8000/v1 and
  # KIMAKI_WHISPER_MODEL=Systran/faster-whisper-small — speaches has no
  # `whisper-1`). Audio never leaves this host and Kimaki uses no cloud
  # transcriber while the URL is set. No ports: only containers on the
  # compose network can reach it.
  # Image is third-party (MIT) and pinned tag@digest, like the runner below.
  whisper:
    image: ghcr.io/speaches-ai/speaches:0.8.3-cpu@sha256:21e3df06d842fb7802ab470dd77c25f0e8c0d22950e8d8c6ae886e851af53ef8
    profiles: ["whisper"]
    restart: unless-stopped
    environment:
      WHISPER__INFERENCE_DEVICE: cpu
      WHISPER__COMPUTE_TYPE: int8
      # Keep the model in RAM between notes. 0.8.x name; 0.9 renames it to
      # STT_MODEL_TTL, so update this line on a major bump.
      WHISPER__TTL: "-1"
      ENABLE_UI: "false"
      LOG_LEVEL: info
    volumes:
      # Model weights are downloaded once (Hugging Face) into this volume.
      - whisper-models:/home/ubuntu/.cache/huggingface/hub
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # Optional: self-hosted GitHub Actions runner. Off by default.
  # Enable: docker compose --profile github-runner up -d  (docs/github-runner.md)
  github-runner:
    image: myoung34/github-runner:latest
    profiles: ["github-runner"]
    restart: unless-stopped
    env_file:
      - path: ../secrets/.env.github-runner
        required: false
    environment:
      RUNNER_NAME: sha2lato-github-runner
      RUNNER_GROUP: default
      LABELS: sha2lato,linux
    volumes:
      - github-runner-data:/home/runner/actions-runner
      # Docker socket: jobs that build images (this repo's CI does) need it.
      # Same trust model as a Forgejo build runner — personal, single-tenant.
      # If jobs still can't reach docker, add `user: root` to this service.
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  # Explicit names (not project-prefixed): UI managers like Arcane leave
  # explicitly-named volumes alone when a project is renamed, so the agent's
  # data can't be copied or orphaned — and the names in docs stay stable.
  # See docs/compose-ui.md.
  agent-data:
    name: sha2lato-agent-data
  dind-certs:
    name: sha2lato-dind-certs
  dind-data:
    name: sha2lato-dind-data
  whisper-models:
    name: sha2lato-whisper-models
  github-runner-data:
    name: sha2lato-github-runner-data
