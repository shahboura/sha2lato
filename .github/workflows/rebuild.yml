# Weekly CVE-freshness rebuild: republish :latest from the current source.
#
# Pulls the newest base image (node:26-trixie-slim), kimaki@latest, opencode v2, and
# Debian security patches at build time, then deploys to the host so running
# boxes pick up the fixes. Monday 03:17 UTC + manual dispatch.
name: Rebuild (weekly)

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    # Declared in build.yml's workflow_call; a reusable workflow sees only
    # the secrets passed here (plus GITHUB_TOKEN). Deploy secrets stay out.
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  deploy:
    name: deploy to host
    needs: [build]
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    # Least privilege: only the deploy secrets reach the reusable workflow.
    secrets:
      DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
