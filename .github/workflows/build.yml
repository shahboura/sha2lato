# Reusable build workflow: multi-arch agent image → GHCR.
#
# Called by:
#   ci.yml      — build + publish on every push to main / version tag
#   rebuild.yml — weekly CVE-freshness rebuild
#
# Can also be dispatched manually from the Actions tab.
name: build

on:
  workflow_call:
    inputs:
      platforms:
        description: Target platforms for buildx
        type: string
        default: linux/amd64,linux/arm64
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU (arm64 emulation)
        if: contains(inputs.platforms || 'linux/amd64,linux/arm64', 'arm64')
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive version stamp
        id: version
        run: |
          ref="${GITHUB_REF:-}"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] || [ "${ref#refs/tags/}" != "$ref" ]; then
            v="${GITHUB_REF_NAME:-}"; [ -n "$v" ] || v="${ref#refs/tags/}"
            echo "value=${v#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sha2lato-agent
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: agent
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: SHA2LATO_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
